# AetherProof — Netlify Configuration
# https://aetherproof-arch.netlify.app

[build]
  publish = "PUBLICATION/Netlify/public"
  command = "echo 'Static site — no build required'"

[build.environment]
  PYTHON_VERSION = "3.11"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
